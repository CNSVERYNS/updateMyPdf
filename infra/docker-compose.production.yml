services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    volumes: ["postgres-production:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["redis-production:/data"]
  pdf-quality:
    build: ../services/pdf-quality
    restart: unless-stopped
  api:
    build: ../apps/api
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_started }
      pdf-quality: { condition: service_started }
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file: ../.env
    volumes: ["n8n-production:/home/node/.n8n"]
    depends_on: [postgres, redis]
    environment:
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
  n8n-worker:
    image: n8nio/n8n:latest
    command: worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
    depends_on: [postgres, redis]
  web:
    build: ../apps/web
    restart: unless-stopped
    env_file: ../.env
    depends_on: [api]

volumes:
  caddy-data:
  caddy-config:
  postgres-production:
  redis-production:
  n8n-production:
